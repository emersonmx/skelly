[package]
name = "skelly"
version = "1.3.1"
description = "A simple scaffold tool written in Rust."
authors = ["Emerson Max de Medeiros Silva <emersonmx@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tera = { version = "2", features = ["glob_fs"] }
tera-contrib = { version = "0.2", features = [
    "base64",
    "date",
    "filesize_format",
    "format",
    "json",
    "rand",
    "regex",
    "slug",
    "urlencode",
] }
thiserror = "2"
toml = "1"
walkdir = "2"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0
